<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Square Hole – Diabolical Edition</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(45deg,#ffdd99,#99ccff);display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;touch-action:manipulation;}
header{text-align:center;padding:15px;cursor:grab;}
.tabs{display:flex;gap:10px;margin:20px 0;}
.tab-btn{padding:10px 20px;background:rgba(255,255,255,0.5);border:none;border-radius:10px 10px 0 0;cursor:pointer;}
.tab-btn.active{background:white;font-weight:bold;}
.tab-content{width:90%;max-width:800px;background:rgba(255,255,255,0.85);border-radius:12px;padding:20px;display:none;min-height:350px;}
.tab-content.active{display:block;}
#game{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;}
#shapes,#holes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
.shape,.hole{width:90px;height:90px;cursor:grab;touch-action:none;}
.circle{clip-path:circle(50%);background:crimson;}
.triangle{clip-path:polygon(50% 0%,0% 100%,100% 100%);background:royalblue;}
.pentagon{clip-path:polygon(50% 0%,0% 38%,19% 100%,81% 100%,100% 38%);background:gold;}
.hexagon{clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);background:mediumseagreen;}
.star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:violet;}
.square-hole{border:4px solid #333;background:#ddd;}
.circle-hole{clip-path:circle(50%);border:2px dashed #333;background:#eee;}
.triangle-hole{clip-path:polygon(50% 0%,0% 100%,100% 100%);border:2px dashed #333;background:#eee;}
.pentagon-hole{clip-path:polygon(50% 0%,0% 38%,19% 100%,81% 100%,100% 38%);border:2px dashed #333;background:#eee;}
.hexagon-hole{clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);border:2px dashed #333;background:#eee;}
.star-hole{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border:2px dashed #333;background:#eee;}
.ach-item{padding:8px;margin:4px 0;background:#eee;border-radius:6px;opacity:.5;}
.ach-item.unlocked{opacity:1;border-left:4px solid gold;}
#achievement-popup{position:fixed;top:20px;right:20px;background:gold;padding:15px;display:none;z-index:9999;}
#achievement-popup.show{display:block;}
</style>
</head>
<body>

<header id="main-title" data-draggable="true">
<h1>It Goes In The Square Hole</h1>
<p id="judgement-text" data-draggable="true">Everything fits... if you believe.</p>
</header>

<div class="tabs">
<button class="tab-btn active" data-tab="game">Game</button>
<button class="tab-btn" id="ach-tab-btn" data-tab="achievements" data-draggable="true">Achievements</button>
<button class="tab-btn" id="patch-tab-btn" data-tab="patch" data-draggable="true">Patch Notes</button>
</div>

<div id="game-tab" class="tab-content active">
<div style="text-align:center;font-size:1.4em;margin-bottom:10px;">
Placed: <strong id="count">0</strong>
</div>

<div id="game">
<div id="shapes"></div>
<div id="holes">
<div class="hole square-hole" id="main-square" data-type="any"></div>
<div class="hole circle-hole" data-type="circle"></div>
<div class="hole triangle-hole" data-type="triangle"></div>
<div class="hole pentagon-hole" data-type="pentagon"></div>
<div class="hole hexagon-hole" data-type="hexagon"></div>
<div class="hole star-hole" data-type="star"></div>
</div>
</div>
</div>

<div id="achievements-tab" class="tab-content">
<h2>Achievements</h2>
<div id="achievement-list"></div>
</div>

<div id="patch-tab" class="tab-content">
<h2>Patch Notes</h2>
<ul>
<li>Reduced hope by 12%</li>
<li>Improved square performance</li>
<li>Adjusted expectations</li>
</ul>
</div>

<div id="achievement-popup">
<strong>Achievement Unlocked!</strong>
<div id="pop-name"></div>
</div>

<script>
let placed=parseInt(localStorage.getItem('placed')||0);
let unlocked=new Set(JSON.parse(localStorage.getItem('unlocked')||'[]'));
let idleTime=parseInt(localStorage.getItem('idle')||0);

const shapeTypes=["circle","triangle","pentagon","hexagon","star"];
let usedShapes=new Set();

function spawnShapes(){
  const container=document.getElementById("shapes");
  container.innerHTML="";
  shapeTypes.forEach(type=>{
    const div=document.createElement("div");
    div.className="shape "+type;
    div.dataset.type=type;
    div.dataset.draggable="true";
    container.appendChild(div);
  });
}
spawnShapes();

function save(){
  localStorage.setItem('placed',placed);
  localStorage.setItem('unlocked',JSON.stringify([...unlocked]));
  localStorage.setItem('idle',idleTime);
}

setInterval(()=>{
  idleTime+=1000;
  save();
  checkAchievements();
},1000);

const achievements=[
{id:'10',name:"10 Squares – Baby Steps",desc:"Gold star for effort.",check:()=>placed>=10},
{id:'50',name:"50 Squares – Getting Serious",desc:"Lifestyle choice.",check:()=>placed>=50},
{id:'100',name:"100 Squares – Square Obsession",desc:"Rent-free.",check:()=>placed>=100},
{id:'500',name:"500 Squares – Halfway to Madness",desc:"No return ticket.",check:()=>placed>=500},
{id:'1000',name:"1000 Squares – Why Though?",desc:"No applause.",check:()=>placed>=1000},
{id:'idle2m',name:"Pro Procrastinator",desc:"2 minutes idle.",check:()=>idleTime>=120000},
{id:'idle5m',name:"Supreme Sloth",desc:"5 minutes idle. Incredible dedication to nothing.",check:()=>idleTime>=300000},
{id:'idle10m',name:"Master of Time Wasting",desc:"10 minutes idle. You monster.",check:()=>idleTime>=600000},
{id:'title-square',name:"Title Goes In The Square Hole",desc:"Iconic.",check:()=>false},
{id:'ach-tab-square',name:"Achievements Go In The Square Hole Too",desc:"Meta.",check:()=>false},
{id:'judgement-square',name:"Judgement Goes In The Square Hole",desc:"Silenced.",check:()=>false},
{id:'patch-square',name:"Patch Notes Go In The Square Hole",desc:"Updates rejected.",check:()=>false},
{id:'gaslight-square',name:"Gaslighting Goes In The Square Hole",desc:"Contained.",check:()=>false},
{id:'1000000',name:"One Million Squares",desc:"You did it. Why?",check:()=>placed>=1000000},
{id:'again',name:"Again?",desc:"The counter reset.",check:()=>false}
];

function unlock(id){
  if(unlocked.has(id))return;
  unlocked.add(id);
  save();
  const a=achievements.find(x=>x.id===id);
  const el=document.getElementById("ach-"+id);
  if(el)el.classList.add("unlocked");
  document.getElementById("pop-name").innerHTML="<b>"+a.name+"</b><br>"+a.desc;
  document.getElementById("achievement-popup").classList.add("show");
  setTimeout(()=>document.getElementById("achievement-popup").classList.remove("show"),3000);
  if(id==='1000000'){
    setTimeout(()=>{
      placed=0;
      usedShapes.clear();
      spawnShapes();
      unlock('again');
      save();
      updateCount();
    },2500);
  }
}

function checkAchievements(){achievements.forEach(a=>{if(!unlocked.has(a.id)&&a.check())unlock(a.id);});}
function updateCount(){document.getElementById("count").textContent=placed;}

let dragged=null,offsetX=0,offsetY=0;

document.addEventListener("pointerdown",e=>{
  let d=e.target.closest("[data-draggable='true']");
  if(!d)return;
  dragged=d;
  const r=d.getBoundingClientRect();
  offsetX=e.clientX-r.left;
  offsetY=e.clientY-r.top;
  d.style.position="fixed";
  d.style.zIndex=9999;
});

document.addEventListener("pointermove",e=>{
  if(!dragged)return;
  dragged.style.left=(e.clientX-offsetX)+"px";
  dragged.style.top=(e.clientY-offsetY)+"px";
});

document.addEventListener("pointerup",e=>{
  if(!dragged)return;
  let drop=document.elementFromPoint(e.clientX,e.clientY);
  if(drop) drop=drop.closest(".hole");
  if(drop){
    const holeType=drop.dataset.type;
    const shapeType=dragged.dataset.type;
    if(holeType==="any" || holeType===shapeType){
      if(dragged.classList.contains("shape") && !usedShapes.has(shapeType)){
        usedShapes.add(shapeType);
        dragged.remove();
        placed++;
        updateCount();
        checkAchievements();
        save();
      }
      if(usedShapes.size===5){
        usedShapes.clear();
        spawnShapes();
      }
    }
    if(dragged.id==="main-title")unlock("title-square");
    if(dragged.id==="ach-tab-btn")unlock("ach-tab-square");
    if(dragged.id==="judgement-text")unlock("judgement-square");
    if(dragged.id==="patch-tab-btn")unlock("patch-square");
  }
  dragged.style.position="";
  dragged=null;
});

document.querySelectorAll(".tab-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById(b.dataset.tab+"-tab").classList.add("active");
  });
});

function init(){
  updateCount();
  const list=document.getElementById("achievement-list");
  achievements.forEach(a=>{
    const div=document.createElement("div");
    div.id="ach-"+a.id;
    div.className="ach-item";
    div.innerHTML="<b>"+a.name+"</b><br>"+a.desc;
    if(unlocked.has(a.id))div.classList.add("unlocked");
    list.appendChild(div);
  });
  checkAchievements();
}
init();
</script>
</body>
</html>
