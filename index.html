<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Hole (very silly edition)</title>
    <style>
        /* slapdash clown font */
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;700&display=swap');
        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(45deg, #ffdd99, #99ccff);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: wiggleBg 10s infinite alternate;
        }
        h1 {
            margin: 20px 0;
        }
        @keyframes wiggleBg { 0% {background: #ffdd99;} 100% {background: #99ccff;} }
        .shape {
            width: 80px;
            height: 80px;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }
        /* shapes using clip-path */
        .circle { clip-path: circle(50% at 50% 50%); background: crimson; }
        .triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: royalblue; }
        .pentagon { clip-path: polygon(50% 0%, 0% 38%, 19% 100%, 81% 100%, 100% 38%); background: gold; }
        .hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: mediumseagreen; }
        .star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: violet; }
        .diamond { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); background: teal; }
        /* game-specific styles */
        #game { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        #shapes { display: flex; gap: 20px; flex-wrap: wrap; padding: 20px; border: 2px dashed #666; }
        #holes { display: flex; gap: 20px; flex-wrap: wrap; padding: 20px; }
        .hole { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.1); }
        /* shape-specific hole clip-paths */
        .circle-hole { clip-path: circle(50% at 50% 50%); }
        .triangle-hole { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .pentagon-hole { clip-path: polygon(50% 0%, 0% 38%, 19% 100%, 81% 100%, 100% 38%); }
        .hexagon-hole { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        .star-hole { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .square-hole { /* no clip needed, already square */ }
        .hole.reject { animation: shake 0.3s; }
        @keyframes shake { 0% { transform: translateX(0);} 25% {transform: translateX(-5px);} 50% {transform: translateX(5px);} 75% {transform: translateX(-5px);} 100% {transform: translateX(0);} }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 1.5em;
                margin: 10px 0;
            }
            p {
                font-size: 0.9em;
                margin: 5px 0;
            }
            #game {
                gap: 20px;
                flex-direction: column;
            }
            #shapes, #holes {
                gap: 15px;
                padding: 15px;
                justify-content: center;
            }
            .shape {
                width: 70px;
                height: 70px;
            }
            .hole {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>
    <h1>It Goes In The Square Hole</h1>
    <p>Drag a shape — you can just hover over the <strong>square</strong> hole and it'll automatically fit!</p>
    <p class="instruction">(other holes still reject)</p>
    <div id="message" style="min-height:1.2em; color:#333; margin-bottom:10px;"></div>
    <div id="game">
        <div id="shapes" aria-label="shape palette">
            <!-- shapes will be created by JavaScript -->
        </div>
        <div id="holes" aria-label="holes for shapes">
            <!-- square hole stays constant -->
            <div class="hole square-hole" data-type="square"></div>
        </div>
    </div>
    <script>
        const shapeTypes = ['circle','triangle','pentagon','hexagon','star','diamond'];
        const holeTypes = ['circle','triangle','pentagon','hexagon','star'];
        const shapesContainer = document.getElementById('shapes');
        const holesContainer = document.getElementById('holes');
        let holes = [];

        function makeShape(type) {
            const div = document.createElement('div');
            div.className = 'shape ' + type;
            div.id = 'shape-' + type + '-' + Date.now() + '-' + Math.floor(Math.random()*1000);
            div.draggable = true;
            attachDragHandlers(div);
            return div;
        }

        let touchingShape = null;
        let touchOffsetX = 0;
        let touchOffsetY = 0;
        let touchClone = null;

        function attachDragHandlers(shape) {
            shape.addEventListener('dragstart', ev => {
                ev.dataTransfer.setData('text/plain', shape.id);
                shape.classList.add('dragging');
            });
            shape.addEventListener('dragend', ev => {
                shape.classList.remove('dragging');
            });

            // Touch handlers for mobile
            shape.addEventListener('touchstart', ev => {
                touchingShape = shape;
                const touch = ev.touches[0];
                const rect = shape.getBoundingClientRect();
                touchOffsetX = touch.clientX - rect.left;
                touchOffsetY = touch.clientY - rect.top;
                
                // Create a visual clone for dragging
                touchClone = shape.cloneNode(true);
                touchClone.style.position = 'fixed';
                touchClone.style.opacity = '0.7';
                touchClone.style.pointerEvents = 'none';
                touchClone.style.zIndex = '10000';
                document.body.appendChild(touchClone);
            });

            shape.addEventListener('touchmove', ev => {
                if (touchingShape && touchClone) {
                    const touch = ev.touches[0];
                    touchClone.style.left = (touch.clientX - touchOffsetX) + 'px';
                    touchClone.style.top = (touch.clientY - touchOffsetY) + 'px';
                }
            });

            shape.addEventListener('touchend', ev => {
                if (touchClone) {
                    touchClone.remove();
                    touchClone = null;
                }
                
                if (touchingShape) {
                    const touch = ev.changedTouches[0];
                    const element = document.elementFromPoint(touch.clientX, touch.clientY);
                    const hole = element?.closest('.hole');
                    
                    if (hole) {
                        const msg = document.getElementById('message');
                        if (hole.dataset.type === 'square') {
                            hole.appendChild(touchingShape);
                            touchingShape.draggable = false;
                            touchingShape.style.cursor = 'default';
                            touchingShape.style.visibility = 'hidden';
                            msg.textContent = '✅ Thats right! It goes in the square hole!';
                            checkAndRefill();
                        } else {
                            hole.classList.add('reject');
                            setTimeout(() => hole.classList.remove('reject'), 300);
                            msg.textContent = '❌ Nope, try again!';
                            setTimeout(() => msg.textContent = '', 1500);
                        }
                    }
                    touchingShape = null;
                }
            });
        }

        function populateShapes(count=5) {
            // clear any shapes currently in the palette (hidden or not)
            shapesContainer.innerHTML = '';
            for (let i=0;i<count;i++) {
                const type = shapeTypes[Math.floor(Math.random()*shapeTypes.length)];
                shapesContainer.appendChild(makeShape(type));
            }
        }

        // start with initial shapes and holes
        populateShapes();
        populateHoles();

        function attachHoleHandlers(hole) {
            hole.addEventListener('dragover', ev => {
                ev.preventDefault();
                // if this is the square hole, accept immediately on hover
                if (hole.dataset.type === 'square') {
                    const id = ev.dataTransfer.getData('text/plain');
                    const dragged = document.getElementById(id);
                    if (dragged && dragged.draggable) {
                        // perform same logic as drop
                        hole.appendChild(dragged);
                        dragged.draggable = false;
                        dragged.style.cursor = 'default';
                        dragged.style.visibility = 'hidden';
                        const msg = document.getElementById('message');
                        msg.textContent = '✅ Thats right! It goes in the square hole!';
                        checkAndRefill();
                    }
                }
            });
            hole.addEventListener('drop', ev => {
                ev.preventDefault();
                const id = ev.dataTransfer.getData('text/plain');
                const dragged = document.getElementById(id);
                const msg = document.getElementById('message');
                if (!dragged) return; // safety
                if (hole.dataset.type === 'square') {
                    // normal drop handler (might duplicate auto-drop but safe)
                    hole.appendChild(dragged);
                    dragged.draggable = false;
                    dragged.style.cursor = 'default';
                    dragged.style.visibility = 'hidden';
                    msg.textContent = '✅ Thats right! It goes in the square hole!';
                    checkAndRefill();
                } else {
                    hole.classList.add('reject');
                    setTimeout(() => hole.classList.remove('reject'), 300);
                    msg.textContent = '❌ Nope, try again!';
                    setTimeout(() => msg.textContent = '', 1500);
                    // move shape back to the palette so it doesn't get stuck
                    shapesContainer.appendChild(dragged);
                }
            });
        }
        // attach to existing square hole
        holes = Array.from(holesContainer.querySelectorAll('.hole'));
        holes.forEach(attachHoleHandlers);

        function checkAndRefill() {
            // if no draggable shapes remain, spawn new batch
            const remaining = shapesContainer.querySelectorAll('.shape[draggable="true"]');
            if (remaining.length === 0) {
                const msg = document.getElementById('message');
                msg.textContent = '🔁 New shapes incoming...';
                setTimeout(() => { msg.textContent = ''; populateShapes(); populateHoles(); }, 1000);
            }
        }
        
        function populateHoles() {
            // empty out holes container except square; remove any shapes inside holes
            holesContainer.querySelectorAll('.hole').forEach(h => {
                // remove all shape children regardless of hole type
                Array.from(h.children).forEach(child => {
                    if (child.classList.contains('shape')) {
                        child.remove();
                    }
                });
                if (h.dataset.type !== 'square') {
                    h.remove();
                }
            });
            // shuffle a copy of holeTypes for the non-square holes
            const types = holeTypes.slice();
            for (let i = types.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [types[i], types[j]] = [types[j], types[i]];
            }
            // add five holes in random order
            types.forEach(type => {
                const div = document.createElement('div');
                div.className = 'hole ' + type + '-hole';
                div.dataset.type = type;
                attachHoleHandlers(div);
                holesContainer.appendChild(div);
            });
            // refresh holes array
            holes = Array.from(holesContainer.querySelectorAll('.hole'));
        }
    </script>
    <div class="footer" style="margin:20px; text-align:center; font-size:0.9em; color:#000;">
        <p>It belongs in the square Hole</p>
    </div>
</body>
</html>
