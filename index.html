<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Square Hole – Ultimate Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #ffdd99;
  --bg2: #99ccff;
  --square-color: #ff6b6b;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  font-family: 'Nunito', sans-serif;
  margin:0; display:flex; flex-direction:column; align-items:center;
  min-height:100vh; overflow-x:hidden; touch-action:manipulation;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
}
header { text-align:center; padding:15px; cursor:grab; user-select:none; }
h1 { font-family: 'Fredoka One', cursive; font-size: 2.2em; margin: 0 0 4px; color: #333; }
.tabs { display:flex; gap:10px; margin:20px 0; }
.tab-btn {
  padding:10px 20px;
  background:rgba(255,255,255,0.5);
  border:none; border-radius:10px 10px 0 0; cursor:pointer;
  font-family: 'Nunito', sans-serif; font-weight:700; font-size:1em;
  transition: background 0.2s;
}
.tab-btn.active { background:white; font-weight:900; }
.tab-content {
  width:90%; max-width:800px;
  background:rgba(255,255,255,0.85); border-radius:0 12px 12px 12px; padding:20px;
  display:none; min-height:350px;
}
.tab-content.active { display:block; }
#game { display:flex; gap:40px; flex-wrap:wrap; justify-content:center; align-items:center; }
#shapes, #holes { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; align-items:center; }

.shape, .hole { width:90px; height:90px; touch-action:none; border-radius:6px; }
.shape { cursor:grab; user-select:none; }

.circle   { clip-path:circle(50%); background:crimson; }
.triangle { clip-path:polygon(50% 0%,0% 100%,100% 100%); background:royalblue; }
.pentagon { clip-path:polygon(50% 0%,0% 38%,19% 100%,81% 100%,100% 38%); background:gold; }
.hexagon  { clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); background:mediumseagreen; }
.star     { clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); background:violet; }

.square-hole  { border:4px solid #333; background:#ddd; position:relative; }
.circle-hole  { clip-path:circle(50%); background:#eee; }
.triangle-hole{ clip-path:polygon(50% 0%,0% 100%,100% 100%); background:#eee; }
.pentagon-hole{ clip-path:polygon(50% 0%,0% 38%,19% 100%,81% 100%,100% 38%); background:#eee; }
.hexagon-hole { clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); background:#eee; }
.star-hole    { clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); background:#eee; }

.hole.glow {
  filter: drop-shadow(0 0 10px gold);
  transition: filter 0.15s;
}

.ach-item { padding:8px; margin:4px 0; background:#eee; border-radius:6px; opacity:.5; }
.ach-item.unlocked { opacity:1; border-left:4px solid gold; }

#achievement-popup {
  position:fixed; top:20px; right:20px;
  background:gold; padding:15px; display:none;
  z-index:10000; border-radius:10px;
  font-family: 'Nunito', sans-serif; font-weight:700;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  animation: pop-in 0.3s ease;
}
#achievement-popup.show { display:block; }
@keyframes pop-in {
  from { transform: scale(0.5) translateY(-20px); opacity:0; }
  to   { transform: scale(1) translateY(0); opacity:1; }
}

/* Rejection toast */
#rejection-toast {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px);
  background:#333; color:white; padding:12px 24px;
  border-radius:30px; z-index:10000; font-weight:700;
  transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
  opacity:0; pointer-events:none; white-space:nowrap;
}
#rejection-toast.show {
  transform: translateX(-50%) translateY(0);
  opacity:1;
}

/* Gaslight fake toast - draggable */
#fake-toast {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  background:#4caf50; color:white; padding:12px 20px;
  border-radius:30px; z-index:9000; font-weight:700; cursor:grab;
  display:none; user-select:none;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
#fake-toast.visible { display:block; }

.count-display { text-align:center; font-size:1.4em; margin-bottom:10px; font-weight:700; }
</style>
</head>
<body>

<header id="main-title" data-draggable="true">
  <h1>It Goes In The Square Hole</h1>
  <p id="judgement-text" data-draggable="true">Everything fits... if you believe.</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="game">Game</button>
  <button class="tab-btn" id="ach-tab-btn" data-tab="achievements" data-draggable="true">Achievements</button>
  <button class="tab-btn" id="patch-tab-btn" data-tab="patch" data-draggable="true">Patch Notes</button>
</div>

<div id="game-tab" class="tab-content active">
  <div class="count-display">Placed: <strong id="count">0</strong></div>
  <div id="game">
    <div id="shapes"></div>
    <div id="holes">
      <div class="hole square-hole" data-type="any" id="main-square"></div>
      <div class="hole circle-hole"   data-type="circle"></div>
      <div class="hole triangle-hole" data-type="triangle"></div>
      <div class="hole pentagon-hole" data-type="pentagon"></div>
      <div class="hole hexagon-hole"  data-type="hexagon"></div>
      <div class="hole star-hole"     data-type="star"></div>
    </div>
  </div>
</div>

<div id="achievements-tab" class="tab-content">
  <h2>Achievements</h2>
  <div id="achievement-list"></div>
</div>

<div id="patch-tab" class="tab-content">
  <h2>Patch Notes</h2>
  <ul>
    <li>Reduced hope by 12%</li>
    <li>Improved square performance</li>
    <li>Adjusted expectations</li>
  </ul>
</div>

<div id="achievement-popup">
  <strong>🏆 Achievement Unlocked!</strong>
  <div id="pop-name"></div>
</div>

<div id="rejection-toast"></div>

<!-- Gaslight fake toast – spawned by JS -->
<div id="fake-toast" data-draggable="true">✨ Achievement Progress Saved!</div>

let wrongHoles = parseInt(localStorage.getItem('wrongHoles') || 0);
let wrongByType = JSON.parse(localStorage.getItem('wrongByType') || '{}');
let dragged = null, offsetX = 0, offsetY = 0;
let draggedOriginalParent = null, draggedOriginalStyle = null;
const shapeTypes = ["circle","triangle","pentagon","hexagon","star"];
let usedShapes = new Set();

const rejectionMessages = {
  circle:   ["That's not a circle hole... wait.", "SQUARE HOLE. S-Q-U-A-R-E.", "Nice try, roundie."],
  triangle: ["Triangles are posers.", "Three sides? We don't do that here.", "IT GOES IN THE SQUARE HOLE."],
  pentagon: ["Five sides too many.", "Pentagon? More like Penta-GONE.", "Nope. Square. Hole. Do it."],
  hexagon:  ["Bees aren't real. Neither is this hexagon.", "Six sides of no.", "SQUARE HOLE ONLY."],
  star:     ["Stars are for the SKY.", "Too pointy. Too free. Square hole.", "Glitter can't save you here."],
  default:  ["NO.", "WRONG HOLE.", "Square. Hole. Now.", "Unacceptable.", "Try the square one next door."]
};

function getRejection(type) {
  const pool = rejectionMessages[type] || rejectionMessages.default;
  return pool[Math.floor(Math.random() * pool.length)];
}

let rejectionTimer = null;
function showRejection(msg) {
  const toast = document.getElementById('rejection-toast');
  toast.textContent = msg;
  toast.classList.add('show');
  if (rejectionTimer) clearTimeout(rejectionTimer);
  rejectionTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function spawnShapes() {
  const container = document.getElementById("shapes");
  container.innerHTML = "";
  shapeTypes.forEach(type => {
    const div = document.createElement("div");
    div.className = "shape " + type;
    div.dataset.type = type;
    div.dataset.draggable = "true";
    container.appendChild(div);
  });
}
spawnShapes();

function save() {
  try {
    localStorage.setItem('placed', placed);
    localStorage.setItem('unlocked', JSON.stringify([...unlocked]));
    localStorage.setItem('idle', idleTime);
    localStorage.setItem('wrongHoles', wrongHoles);
    localStorage.setItem('wrongByType', JSON.stringify(wrongByType));
  } catch(e) {}
}

setInterval(() => { idleTime += 1000; save(); checkAchievements(); }, 1000);

let gaslightShown = false;
setTimeout(() => {

    document.getElementById('fake-toast').classList.add('visible');

function unlock(id) {
  if (unlocked.has(id)) return;
  unlocked.add(id);
  save();
  const a = achievements.find(x => x.id === id);
  if (!a) return;
  const el = document.getElementById("ach-" + id);
  if (el) el.classList.add("unlocked");
  document.getElementById("pop-name").innerHTML = "<b>" + a.name + "</b><br>" + a.desc;
  const popup = document.getElementById("achievement-popup");
  popup.classList.remove("show");
  void popup.offsetWidth; // force reflow for re-animation
  popup.classList.add("show");
  setTimeout(() => popup.classList.remove("show"), 3000);
  if (id === '1000000') {
    setTimeout(() => { placed = 0; save(); updateCount(); unlock('again'); spawnShapes(); }, 2500);
  }
}

function checkAchievements() {
  achievements.forEach(a => {
    if (!unlocked.has(a.id) && a.check()) unlock(a.id);
  });
}
function updateCount() { document.getElementById("count").textContent = placed; }

// ── Drag & Drop ──────────────────────────────────────────────────────────────

const DRAG_THRESHOLD = 6; // pixels of movement before drag starts
let pendingDrag = null;   // candidate element before threshold is crossed
let dragStartX = 0, dragStartY = 0;
let isDragging = false;

document.addEventListener("pointerdown", e => {
  const d = e.target.closest("[data-draggable='true']");
  if (!d) return;

  // Tab buttons should still be clickable — only initiate drag on move
  pendingDrag = d;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  draggedOriginalParent = d.parentElement;
  draggedOriginalStyle = { position: d.style.position, zIndex: d.style.zIndex, left: d.style.left, top: d.style.top };

  const r = d.getBoundingClientRect();
  offsetX = e.clientX - r.left;
  offsetY = e.clientY - r.top;
});

function liftIntoDrag(d, clientX, clientY) {
  dragged = d;
  isDragging = true;
  const r = d.getBoundingClientRect();
  d.style.position = "fixed";
  d.style.zIndex = 9999;
  d.style.left = r.left + "px";
  d.style.top  = r.top  + "px";
  document.body.appendChild(d);
}

document.addEventListener("pointermove", e => {
  // Check if we should start dragging
  if (pendingDrag && !isDragging) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.sqrt(dx*dx + dy*dy) > DRAG_THRESHOLD) {
      liftIntoDrag(pendingDrag, e.clientX, e.clientY);
      pendingDrag = null;
    }
  }

  if (!dragged || !isDragging) return;
  dragged.style.left = (e.clientX - offsetX) + "px";
  dragged.style.top  = (e.clientY - offsetY) + "px";

  // Glow square hole when a shape is near it
  const square = document.getElementById("main-square");
  const r = square.getBoundingClientRect();
  const near = e.clientX > r.left - 20 && e.clientX < r.right + 20 &&
               e.clientY > r.top  - 20 && e.clientY < r.bottom + 20;
  square.classList.toggle("glow", near && dragged.classList.contains("shape"));
});

document.addEventListener("pointerup", e => {
  pendingDrag = null; // cancel pending drag (was just a click)

  if (!dragged || !isDragging) {
    isDragging = false;
    dragged = null;
    return;
  }

  // Temporarily hide dragged element so elementFromPoint sees what's underneath
  dragged.style.visibility = "hidden";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  dragged.style.visibility = "";

  const drop = under ? under.closest(".hole") : null;
  const isSquare = drop && drop.id === "main-square";

  document.getElementById("main-square").classList.remove("glow");

  if (dragged.classList.contains("shape")) {
    if (isSquare) {
      // ✅ Correct hole – accept shape
      const type = dragged.dataset.type;
      if (!usedShapes.has(type)) {
        usedShapes.add(type);
        dragged.remove();
        placed++;
        updateCount();
        checkAchievements();
        save();
      }
      if (usedShapes.size === shapeTypes.length) {
        usedShapes.clear();
        spawnShapes();
      }
    } else if (drop) {
      // ❌ Wrong non-square hole
      const wtype = dragged.dataset.type;
      wrongHoles++;
      wrongByType[wtype] = (wrongByType[wtype] || 0) + 1;
      save();
      checkAchievements();
      showRejection(getRejection(wtype));
      resetDragged();
    } else {
      resetDragged();
    }
  } else {
    // Special draggable items (UI elements)
    if (isSquare) {
      if (dragged.id === "main-title")     unlock("title-square");
      if (dragged.id === "ach-tab-btn")    unlock("ach-tab-square");
      if (dragged.id === "judgement-text") unlock("judgement-square");
      if (dragged.id === "patch-tab-btn")  unlock("patch-square");
      if (dragged.id === "fake-toast")     { unlock("gaslight-square"); dragged.remove(); dragged = null; isDragging = false; return; }
    }
    resetDragged();
  }

  isDragging = false;
  dragged = null;
});

function resetDragged() {
  if (!dragged) return;
  if (draggedOriginalParent) draggedOriginalParent.appendChild(dragged);
  dragged.style.position = draggedOriginalStyle?.position || "";
  dragged.style.zIndex   = draggedOriginalStyle?.zIndex   || "";
  dragged.style.left     = draggedOriginalStyle?.left     || "";
  dragged.style.top      = draggedOriginalStyle?.top      || "";
}

// ── Tabs ─────────────────────────────────────────────────────────────────────

document.querySelectorAll(".tab-btn").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById(b.dataset.tab + "-tab").classList.add("active");
  });
});

// ── Init ──────────────────────────────────────────────────────────────────────

function init() {
  updateCount();
  const list = document.getElementById("achievement-list");
  achievements.forEach(a => {
    const div = document.createElement("div");
    div.id = "ach-" + a.id;
    div.className = "ach-item";
    div.innerHTML = "<b>" + a.name + "</b><br>" + a.desc;
    if (unlocked.has(a.id)) div.classList.add("unlocked");
    list.appendChild(div);
  });
  checkAchievements();
}
init();
</script>
