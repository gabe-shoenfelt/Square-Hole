<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Square Hole – now with sound 😈</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;700&display=swap');

    body {
      font-family: 'Comic Neue', cursive, sans-serif;
      background: linear-gradient(45deg, #ffdd99, #99ccff);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: bgWiggle 12s infinite alternate;
      touch-action: manipulation;
    }

    @keyframes bgWiggle {
      0%   { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    header {
      text-align: center;
      padding: 1rem;
      width: 90%;
      max-width: 900px;
      cursor: grab;
      user-select: none;
    }

    h1 { margin: 0.4em 0 0.1em; font-size: clamp(1.8rem, 7vw, 3.2rem); }
    .subtitle { margin: 0; font-size: clamp(1rem, 4vw, 1.4rem); opacity: 0.9; }

    .tabs {
      display: flex;
      gap: 0.6rem;
      margin: 1rem 0;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 0.6rem 1.4rem;
      font-size: 1.05rem;
      background: rgba(255,255,255,0.5);
      border: none;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
    }

    .tab-btn.active {
      background: white;
      font-weight: bold;
    }

    .tab-content {
      width: 92%;
      max-width: 820px;
      background: rgba(255,255,255,0.75);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 2rem;
      display: none;
    }

    .tab-content.active { display: block; }

    #game {
      display: flex;
      flex-wrap: wrap;
      gap: 2.5rem;
      justify-content: center;
      padding: 1rem;
    }

    #shapes, #holes {
      display: flex;
      flex-wrap: wrap;
      gap: 1.4rem;
      padding: 1.4rem;
      border-radius: 12px;
    }

    #shapes {
      border: 3px dashed #666;
      background: rgba(255,255,255,0.18);
    }

    .shape, .hole {
      width: 90px;
      height: 90px;
      touch-action: none;
      user-select: none;
    }

    .shape {
      transition: transform 0.12s ease-out;
    }

    .shape.dragging,
    .hole.dragging-hole {
      transform: scale(1.18) rotate(5deg);
      box-shadow: 0 12px 32px rgba(0,0,0,0.38);
      opacity: 0.86;
      z-index: 999;
    }

    .circle    { clip-path: circle(50% at 50% 50%);   background: #c62828; }
    .triangle  { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: #1565c0; }
    .pentagon  { clip-path: polygon(50% 0%, 0% 38%, 19% 100%, 81% 100%, 100% 38%); background: #f9a825; }
    .hexagon   { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: #2e7d32; }
    .star      { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: #8e24aa; }
    .diamond   { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); background: teal; }

    .hole {
      background: rgba(0,0,0,0.08);
      border-radius: 12px;
    }

    .square-hole { background: rgba(50,50,50,0.16); }

    .hole.reject {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    #stats, #message {
      text-align: center;
      margin: 1rem 0;
      font-size: 1.25rem;
      color: #111;
    }

    #achievement-popup {
      position: fixed;
      inset: 50% auto auto 50%;
      translate: -50% -50%;
      background: linear-gradient(135deg, #ffeb3b, #ffd54f);
      border: 5px solid #ff4081;
      border-radius: 24px;
      padding: 2rem 1.8rem;
      text-align: center;
      z-index: 10001;
      box-shadow: 0 0 50px rgba(255,64,129,0.6);
      display: none;
      cursor: grab;
      user-select: none;
      max-width: 90%;
    }

    #achievement-popup.show { display: block; }
  </style>
</head>
<body>

<header id="drag-header">
  <h1>It Goes In The Square Hole</h1>
  <p class="subtitle">Now with authentic sound on correct drop (phone + PC)</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="game">Game</button>
  <button class="tab-btn" data-tab="achievements">Achievements</button>
</div>

<div id="game-tab" class="tab-content active">
  <div id="stats">
    Squared: <strong id="placed-count">0</strong>  
    Wrong: <strong id="wrong-count">0</strong>
  </div>
  <div id="message"></div>

  <div id="game">
    <div id="shapes"></div>
    <div id="holes">
      <div class="hole square-hole" data-type="square"></div>
    </div>
  </div>
</div>

<div id="achievements-tab" class="tab-content">
  <h2>Achievements</h2>
  <div id="achievements-list"></div>
</div>

<audio id="square-sound" preload="auto">
  <source src="https://assets.codepen.io/605876/it-goes-in-the-square-hole.mp3" type="audio/mpeg">
</audio>

<script>
// ───────────────────────────────────────────────
//   Variables
// ───────────────────────────────────────────────

const squareSound = document.getElementById('square-sound');

const shapeTypes = ['circle','triangle','pentagon','hexagon','star','diamond'];
const holeTypes  = ['circle','triangle','pentagon','hexagon','star'];

const shapesEl   = document.getElementById('shapes');
const holesEl    = document.getElementById('holes');
const msgEl      = document.getElementById('message');
const placedEl   = document.getElementById('placed-count');
const wrongEl    = document.getElementById('wrong-count');

let placed = 0;
let wrongs = 0;

// ───────────────────────────────────────────────
//   Create & drag shape (PC + touch)
// ───────────────────────────────────────────────

function createShape(type) {
  const div = document.createElement('div');
  div.className = `shape ${type}`;
  div.dataset.type = type;

  // PC drag
  div.draggable = true;
  div.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', type);
    div.classList.add('dragging');
  });
  div.addEventListener('dragend', () => div.classList.remove('dragging'));

  // Touch drag with ghost
  div.addEventListener('touchstart', e => {
    e.stopPropagation();
    const touch = e.touches[0];
    const rect = div.getBoundingClientRect();

    const clone = div.cloneNode(true);
    clone.style.position = 'fixed';
    clone.style.left = `${touch.clientX - rect.width / 2}px`;
    clone.style.top  = `${touch.clientY - rect.height / 2}px`;
    clone.style.opacity = '0.78';
    clone.style.pointerEvents = 'none';
    clone.style.zIndex = '9999';
    document.body.appendChild(clone);

    div._touchClone = clone;
    div._touchOffsetX = touch.clientX - rect.left;
    div._touchOffsetY = touch.clientY - rect.top;
  }, {passive: false});

  div.addEventListener('touchmove', e => {
    if (!div._touchClone) return;
    e.preventDefault();
    const touch = e.touches[0];
    div._touchClone.style.left = `${touch.clientX - div._touchOffsetX}px`;
    div._touchClone.style.top  = `${touch.clientY - div._touchOffsetY}px`;
  }, {passive: false});

  div.addEventListener('touchend', e => {
    if (div._touchClone) {
      div._touchClone.remove();
      delete div._touchClone;
    }

    const touch = e.changedTouches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const hole = el?.closest('.hole');

    handleDrop(hole, div);
  });

  return div;
}

function handleDrop(hole, shapeElement) {
  if (!hole) return;

  if (hole.dataset.type === 'square') {
    placed++;
    placedEl.textContent = placed;
    msgEl.textContent = `✅ It goes in the square hole! (${placed})`;
    squareSound.currentTime = 0;
    squareSound.play().catch(() => {}); // autoplay policy safe-guard
    setTimeout(() => msgEl.textContent = '', 2200);
  } else {
    wrongs++;
    wrongEl.textContent = wrongs;
    hole.classList.add('reject');
    setTimeout(() => hole.classList.remove('reject'), 450);
    msgEl.textContent = "❌ Nope — square hole only";
    setTimeout(() => msgEl.textContent = '', 1800);
  }
}

// ───────────────────────────────────────────────
//   Square hole accepts PC drops
// ───────────────────────────────────────────────

const squareHole = document.querySelector('.square-hole');

squareHole.addEventListener('dragover', e => e.preventDefault());

squareHole.addEventListener('drop', e => {
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  if (type && shapeTypes.includes(type)) {
    placed++;
    placedEl.textContent = placed;
    msgEl.textContent = `✅ It goes in the square hole! (${placed})`;
    squareSound.currentTime = 0;
    squareSound.play().catch(() => {});
    setTimeout(() => msgEl.textContent = '', 2200);
  }
});

// ───────────────────────────────────────────────
//   Populate initial shapes
// ───────────────────────────────────────────────

function populateShapes(count = 5) {
  shapesEl.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const type = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
    shapesEl.appendChild(createShape(type));
  }
}

populateShapes();

// Optional: auto-refill when empty
setInterval(() => {
  if (shapesEl.children.length === 0) {
    populateShapes(4);
    msgEl.textContent = "New shapes arrived...";
    setTimeout(() => msgEl.textContent = '', 1800);
  }
}, 6000);
</script>
</body>
</html>
