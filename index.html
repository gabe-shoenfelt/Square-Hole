<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Square Hole (the square edition)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;700&display=swap');
    body {
      font-family: 'Comic Neue', cursive, sans-serif;
      background: linear-gradient(45deg, #ffdd99, #99ccff);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: wiggleBg 10s infinite alternate;
      min-height: 100vh;
      overflow-x: hidden;
    }
    @keyframes wiggleBg { 0% {background: #ffdd99;} 100% {background: #99ccff;} }

    header { text-align: center; padding: 15px; width: 90%; cursor: grab; user-select: none; z-index: 10; }
    
    .tabs { display: flex; gap: 10px; margin: 20px 0; }
    .tab-btn {
      padding: 10px 20px;
      font-size: 1.1em;
      background: rgba(255,255,255,0.4);
      border: none;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
    }
    .tab-btn.active { background: white; font-weight: bold; }

    .tab-content {
      width: 90%;
      max-width: 800px;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      display: none;
      min-height: 400px;
    }
    .tab-content.active { display: block; }

    #game { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; padding: 20px; }
    #shapes, #holes { display: flex; gap: 20px; flex-wrap: wrap; padding: 20px; border-radius: 12px; }
    #shapes { border: 2px dashed #666; background: rgba(255,255,255,0.2); min-height: 100px; }

    .shape, .hole { width: 90px; height: 90px; cursor: grab; }
    
    .circle    { clip-path: circle(50%); background: crimson; }
    .triangle  { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: royalblue; }    .pentagon  { clip-path: polygon(50% 0%, 0% 38%, 19% 100%, 81% 100%, 100% 38%); background: gold; }
    .hexagon   { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: mediumseagreen; }
    .star      { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: violet; }
    .diamond   { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); background: teal; }

    .hole { background: rgba(0,0,0,0.1); }
    .square-hole { border: 4px solid #333; background: #ddd; }
    .circle-hole { clip-path: circle(50%); }
    .triangle-hole { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }

    .ach-list { list-style: none; padding: 0; }
    .ach-item { 
      padding: 10px; margin: 5px 0; background: #eee; border-radius: 8px; 
      opacity: 0.5; border-left: 5px solid #ccc; 
    }
    .ach-item.unlocked { opacity: 1; background: #fff; border-left-color: gold; }

    #achievement-popup {
      position: fixed; top: 20px; right: 20px; background: gold;
      padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: none; z-index: 1000; animation: slideIn 0.5s;
    }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  </style>
</head><body>

<header id="main-title" draggable="true">
  <h1>It Goes In The Square Hole</h1>
  <p>Everything fits... if you believe.</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="openTab('game')">Game</button>
  <button class="tab-btn" id="ach-tab-btn" draggable="true" onclick="openTab('achievements')">Achievements</button>
</div>

<div id="game-tab" class="tab-content active">
  <div style="text-align:center; font-size:1.5em; margin-bottom:10px;">Placed: <strong id="count">0</strong></div>
  <div id="game">
    <div id="shapes">
      <div class="shape circle" id="s1" draggable="true"></div>      <div class="shape triangle" id="s2" draggable="true"></div>
      <div class="shape pentagon" id="s3" draggable="true"></div>
      <div class="shape hexagon" id="s4" draggable="true"></div>
      <div class="shape star" id="s5" draggable="true"></div>
      <div class="shape diamond" id="s6" draggable="true"></div>    </div>
    <div id="holes">
      <div class="hole circle-hole" id="h1" draggable="true"></div>
      <div class="hole square-hole" id="main-square"></div>
      <div class="hole triangle-hole" id="h2" draggable="true"></div>
    </div>
  </div>
</div>

<div id="achievements-tab" class="tab-content">
  <div style="display: flex; gap: 20px;">
    <div style="flex: 1;">
      <h2>Achievements</h2>
      <div id="achievement-list" class="ach-list"></div>
    </div>
    <div style="text-align: center;">
      <h3>Menu Square</h3>
      <div class="hole square-hole" id="menu-square" style="margin: 0 auto;"></div>
    </div>
  </div>
</div>

<div id="achievement-popup">
  <strong>Achievement Unlocked!</strong>
  <div id="pop-name"></div>
</div>

<script>
let placed = 0;
const unlocked = new Set();

const achievements = [
  {id:'10', name:"10 Squares", desc:"Placed 10 shapes.", check:()=>placed>=10},
  {id:'50', name:"50 Squares", desc:"Placed 50 shapes.", check:()=>placed>=50},
  {id:'100', name:"100 Squares", desc:"Placed 100 shapes.", check:()=>placed>=100},
  {id:'500', name:"500 Squares", desc:"Placed 500 shapes.", check:()=>placed>=500},
  {id:'1000', name:"1000 Squares", desc:"Placed 1000 shapes.", check:()=>placed>=1000},
  {id:'title-square', name:"Title Goes In The Square Hole", desc:"Dragged the title into the square.", check:()=>false},
  {id:'ach-tab-square', name:"Achievements Go In The Square Hole", desc:"Dragged the achievements tab into the square.", check:()=>false},  {id:'hole-square', name:"Hole-ception", desc:"Dragged a shaped hole into the square.", check:()=>false}
];

function init() {
  const list = document.getElementById('achievement-list');
  achievements.forEach(ach => {
    const div = document.createElement('div');
    div.id = `ach-${ach.id}`;
    div.className = 'ach-item';
    div.innerHTML = `<strong>${ach.name}</strong><br><small>${ach.desc}</small>`;
    list.appendChild(div);
  });
}

function checkAchievements() {
  achievements.forEach(ach => {    if (!unlocked.has(ach.id) && ach.check()) unlock(ach.id);
  });
}

function unlock(id) {
  if (unlocked.has(id)) return;
  unlocked.add(id);
  const ach = achievements.find(a => a.id === id);
  document.getElementById(`ach-${id}`).classList.add('unlocked');
  const pop = document.getElementById('achievement-popup');
  document.getElementById('pop-name').innerText = ach.name;
  pop.style.display = 'block';
  setTimeout(() => pop.style.display = 'none', 3000);
}

// Drag & Drop Logic
document.addEventListener('dragstart', (e) => {
  e.dataTransfer.setData('sourceId', e.target.id);
  e.dataTransfer.setData('type', e.target.classList.contains('shape') ? 'shape' : e.target.tagName === 'HEADER' ? 'title' : e.target.tagName === 'BUTTON' ? 'tab' : 'hole');
});

const squareHoles = document.querySelectorAll('.square-hole');
squareHoles.forEach(hole => {
  hole.addEventListener('dragover', (e) => e.preventDefault());
  hole.addEventListener('drop', (e) => {
    e.preventDefault();
    const sourceId = e.dataTransfer.getData('sourceId');
    const type = e.dataTransfer.getData('type');
    
    if (type === 'shape') {
      placed++;
      document.getElementById('count').innerText = placed;      const shape = document.getElementById(sourceId);
      shape.parentElement.removeChild(shape);
      setTimeout(() => {
        const newShape = shape.cloneNode(true);
        document.getElementById('shapes').appendChild(newShape);
      }, 500);
      checkAchievements();
    } else if (type === 'title') {
      unlock('title-square');
    } else if (type === 'tab' && sourceId === 'ach-tab-btn') {
      unlock('ach-tab-square');
    } else if (type === 'hole') {
      unlock('hole-square');
    }
  });
});

function openTab(name) {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));  document.getElementById(name + '-tab').classList.add('active');
  if(name === 'game') document.querySelectorAll('.tab-btn')[0].classList.add('active');
  else document.getElementById('ach-tab-btn').classList.add('active');
}

init();
</script>
</body></html>
