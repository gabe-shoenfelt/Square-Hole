<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Hole (the square edition)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;700&display=swap');
    body {
      font-family: 'Comic Neue', cursive, sans-serif;
      background: linear-gradient(45deg, #ffdd99, #99ccff);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: wiggleBg 10s infinite alternate;
      min-height: 100vh;
    }
    @keyframes wiggleBg { 0% {background: #ffdd99;} 100% {background: #99ccff;} }

    header {
      text-align: center;
      padding: 15px;
      width: 90%;
      cursor: grab;
      user-select: none;
    }
    header.dragging-header {
      opacity: 0.8;
      transform: scale(1.05) rotate(2deg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .tabs { display: flex; gap: 10px; margin: 20px 0; }
    .tab-btn {
      padding: 10px 20px;
      font-size: 1.1em;
      background: rgba(255,255,255,0.4);
      border: none;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
    }
    .tab-btn.active { background: white; font-weight: bold; }

    .tab-content {
      width: 90%;
      max-width: 800px;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      display: none;
      cursor: grab;
      user-select: none;
    }
    .tab-content.active { display: block; }
    .tab-content.dragging-tab {
      opacity: 0.8;
      transform: scale(1.03) rotate(1deg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    #game { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; padding: 20px; }
    #shapes, #holes {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      padding: 20px;
      border-radius: 12px;
    }
    #shapes { border: 2px dashed #666; background: rgba(255,255,255,0.2); }

    .shape, .hole {
      width: 90px;
      height: 90px;
      touch-action: none;
      user-select: none;
    }

    .shape.dragging, .hole.dragging-hole {
      transform: scale(1.15) rotate(4deg);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      opacity: 0.9;
      z-index: 999;
    }

    .circle    { clip-path: circle(50% at 50% 50%); background: crimson; }
    .triangle  { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: royalblue; }
    .pentagon  { clip-path: polygon(50% 0%, 0% 38%, 19% 100%, 81% 100%, 100% 38%); background: gold; }
    .hexagon   { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: mediumseagreen; }
    .star      { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: violet; }
    .diamond   { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); background: teal; }

    .hole { border-radius: 12px; background: rgba(0,0,0,0.1); }
    .square-hole { background: rgba(40,40,40,0.2); }
    .hole.reject { animation: shake 0.4s; }
    @keyframes shake { 0%,100% {transform: translateX(0);} 25% {transform: translateX(-6px);} 75% {transform: translateX(6px);} }

    #achievement-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      border: 5px solid #ff6b9d;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      z-index: 10001;
      box-shadow: 0 0 40px rgba(255,107,157,0.9);
      display: none;
      cursor: grab;
    }
    #achievement-popup.show { display: block; }

    .achievement-item {
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: #f5f5f5;
    }
    .achievement-item.unlocked {
      background: #fff9e6;
      border-color: #ff6b9d;
    }
  </style>
</head>
<body>

<header id="drag-header">
  <h1>It Goes In The Square Hole</h1>
  <p>Drag shapes to the holes — only one actually works (trust the title)</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="game">Game</button>
  <button class="tab-btn" data-tab="achievements">Achievements</button>
</div>

<div id="game-tab" class="tab-content active">
  <div id="stats" style="text-align:center; font-size:1.3em; margin:1em 0;">
    Squared: <strong id="placed">0</strong> | Wrong: <strong id="wrong">0</strong>
  </div>
  <div id="message" style="text-align:center; font-size:1.2em; min-height:1.8em; color:#222;"></div>

  <div id="game">
    <div id="shapes"></div>
    <div id="holes"></div>
  </div>
</div>

<div id="achievements-tab" class="tab-content">
  <h2>Achievements</h2>
  <div id="ach-list"></div>
</div>

<div id="achievement-popup">
  <div style="font-size:5em;">🏆</div>
  <h2 id="ach-title">ACHIEVEMENT UNLOCKED!</h2>
  <p id="ach-name"></p>
  <p id="ach-desc"></p>
</div>

<script>
  const shapeTypes = ['circle','triangle','pentagon','hexagon','star','diamond'];
  const holeTypes = ['circle','triangle','pentagon','hexagon','star'];

  const shapesEl = document.getElementById('shapes');
  const holesEl = document.getElementById('holes');
  const msgEl = document.getElementById('message');
  const placedEl = document.getElementById('placed');
  const wrongEl = document.getElementById('wrong');
  const popup = document.getElementById('achievement-popup');
  const achTitle = document.getElementById('ach-title');
  const achName = document.getElementById('ach-name');
  const achDesc = document.getElementById('ach-desc');
  const achList = document.getElementById('ach-list');

  let placed = 0;
  let wrongs = 0;
  let unlocked = new Set();

  const achievements = [
    {id:'10', name:"10 Squares", desc:"Placed 10 shapes.", check:()=>placed>=10},
    {id:'50', name:"50 Squares", desc:"Placed 50 shapes.", check:()=>placed>=50},
    {id:'100', name:"100 Squares", desc:"Placed 100 shapes.", check:()=>placed>=100},
    {id:'500', name:"500 Squares", desc:"Placed 500 shapes.", check:()=>placed>=500},
    {id:'1000', name:"1000 Squares", desc:"Placed 1000 shapes.", check:()=>placed>=1000},
    {id:'title-square', name:"Title Goes In The Square Hole", desc:"Dragged the title into the square.", check:()=>false},
    {id:'ach-tab-square', name:"Achievements Go In The Square Hole", desc:"Dragged the achievements tab into the square.", check:()=>false},
    {id:'hole-square', name:"Hole-ception", desc:"Dragged a shaped hole into the square.", check:()=>false}
  ];

  function unlock(ach) {
    if (unlocked.has(ach.id)) return;
    unlocked.add(ach.id);
    achTitle.textContent = "ACHIEVEMENT UNLOCKED!";
    achName.textContent = ach.name;
    achDesc.textContent = ach.desc;
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 5000);
    renderAchievements();
  }

  function checkAchievements() {
    achievements.forEach(a => {
      if (a.check && a.check()) unlock(a);
    });
  }

  function renderAchievements() {
    achList.innerHTML = '';
    achievements.forEach(a => {
      const div = document.createElement('div');
      div.className = 'achievement-item' + (unlocked.has(a.id) ? ' unlocked' : '');
      div.innerHTML = `<strong>${a.name}</strong><br>${a.desc}`;
      achList.appendChild(div);
    });
  }

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
      if (btn.dataset.tab === 'achievements') renderAchievements();
    });
  });

  // Draggable header + achievements tab
  function makeDraggable(el, achId) {
    let dragging = false, offsetX, offsetY, origLeft, origTop;

    el.addEventListener('mousedown', e => {
      if (e.target.closest('button')) return;
      dragging = true;
      const rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      origLeft = rect.left;
      origTop = rect.top;
      el.style.position = 'fixed';
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';
      el.style.width = rect.width + 'px';
      el.classList.add(el.id === 'drag-header' ? 'dragging-header' : 'dragging-tab');
      e.preventDefault();
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      el.style.left = (e.clientX - offsetX) + 'px';
      el.style.top = (e.clientY - offsetY) + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging-header', 'dragging-tab');

      const sqRect = document.querySelector('.square-hole').getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      const dist = Math.hypot(
        elRect.left + elRect.width/2 - (sqRect.left + sqRect.width/2),
        elRect.top + elRect.height/2 - (sqRect.top + sqRect.height/2)
      );

      if (dist < 140 && achId) {
        const ach = achievements.find(a => a.id === achId);
        if (ach) {
          ach.check = () => true;
          checkAchievements();
          msgEl.textContent = `The ${el.id === 'drag-header' ? 'title' : 'achievements tab'} went in the square hole.`;
          setTimeout(() => msgEl.textContent = '', 4000);
        }
      }

      el.style.transition = 'all 0.6s cubic-bezier(0.34,1.56,0.64,1)';
      el.style.left = origLeft + 'px';
      el.style.top = origTop + 'px';
      setTimeout(() => {
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';
        el.style.width = '';
        el.style.transition = '';
      }, 650);
    });
  }

  makeDraggable(document.getElementById('drag-header'), 'title-square');
  makeDraggable(document.getElementById('achievements-tab'), 'ach-tab-square');

  // Shape creation + drag
  function createShape(type) {
    const div = document.createElement('div');
    div.className = `shape ${type}`;
    div.draggable = true;
    div.dataset.type = type;

    // Mouse drag
    div.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', type);
      div.classList.add('dragging');
    });
    div.addEventListener('dragend', () => div.classList.remove('dragging'));

    // Touch drag
    let clone = null;
    div.addEventListener('touchstart', e => {
      const touch = e.touches[0];
      const rect = div.getBoundingClientRect();
      clone = div.cloneNode(true);
      clone.style.position = 'fixed';
      clone.style.left = touch.clientX - rect.width/2 + 'px';
      clone.style.top = touch.clientY - rect.height/2 + 'px';
      clone.style.opacity = '0.8';
      clone.style.pointerEvents = 'none';
      clone.style.zIndex = '9999';
      document.body.appendChild(clone);
    });

    div.addEventListener('touchmove', e => {
      if (!clone) return;
      e.preventDefault();
      const touch = e.touches[0];
      clone.style.left = touch.clientX - clone.offsetWidth/2 + 'px';
      clone.style.top = touch.clientY - clone.offsetHeight/2 + 'px';
    });

    div.addEventListener('touchend', e => {
      if (clone) clone.remove();
      const touch = e.changedTouches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const hole = el?.closest('.hole');

      if (hole) {
        if (hole.dataset.type === 'square') {
          placed++;
          placedEl.textContent = placed;
          msgEl.textContent = `✅ It goes in the square hole! (${placed})`;
          setTimeout(() => msgEl.textContent = '', 2000);
          checkAchievements();
          checkRefill();
        } else {
          wrongs++;
          wrongEl.textContent = wrongs;
          hole.classList.add('reject');
          setTimeout(() => hole.classList.remove('reject'), 400);
          msgEl.textContent = "❌ Nope";
          setTimeout(() => msgEl.textContent = '', 2000);
          shapesEl.appendChild(div);
        }
      }
    });

    return div;
  }

  function populateShapes(count = 5) {
    shapesEl.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const type = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
      shapesEl.appendChild(createShape(type));
    }
  }

  function populateHoles() {
    holesEl.innerHTML = '';
    // Always add the real square hole
    const sq = document.createElement('div');
    sq.className = 'hole square-hole';
    sq.dataset.type = 'square';
    holesEl.appendChild(sq);

    // Add 4 fake shaped holes to throw people off
    const shuffled = [...holeTypes].sort(() => Math.random() - 0.5).slice(0, 4);
    shuffled.forEach(type => {
      const h = document.createElement('div');
      h.className = `hole ${type}-hole`;
      h.dataset.type = type;
      holesEl.appendChild(h);
    });
  }

  function checkRefill() {
    if (shapesEl.children.length === 0) {
      msgEl.textContent = "New 5 shapes incoming...";
      setTimeout(() => {
        msgEl.textContent = '';
        populateShapes(5);
        populateHoles();
      }, 1200);
    }
  }

  // Start
  populateShapes(5);
  populateHoles();
  renderAchievements();
</script>
</body>
</html>
