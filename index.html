<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Hole (very silly edition)</title>
    <style>
        /* slapdash clown font */
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;700&display=swap');
        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(45deg, #ffdd99, #99ccff);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: wiggleBg 10s infinite alternate;
        }
        h1 {
            margin: 20px 0;
        }
        @keyframes wiggleBg { 0% {background: #ffdd99;} 100% {background: #99ccff;} }
        .shape {
            width: 80px;
            height: 80px;
            cursor: grab;
        }
        /* shapes using clip-path */
        .circle { clip-path: circle(50% at 50% 50%); background: crimson; }
        .triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: royalblue; }
        .pentagon { clip-path: polygon(50% 0%, 0% 38%, 19% 100%, 81% 100%, 100% 38%); background: gold; }
        .hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: mediumseagreen; }
        .star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: violet; }
        .diamond { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); background: teal; }
        /* game-specific styles */
        #game { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        #shapes { display: flex; gap: 20px; flex-wrap: wrap; padding: 20px; border: 2px dashed #666; }
        #holes { display: flex; gap: 20px; flex-wrap: wrap; padding: 20px; }
        .hole { width: 100px; height: 100px; border: 3px dashed #333; display: flex; align-items: center; justify-content: center; }
        .hole.reject { animation: shake 0.3s; }
        @keyframes shake { 0% { transform: translateX(0);} 25% {transform: translateX(-5px);} 50% {transform: translateX(5px);} 75% {transform: translateX(-5px);} 100% {transform: translateX(0);} }
    </style>
</head>
<body>
    <h1>It Goes In The Square Hole</h1>
    <p>Drag a shape and drop it into a hole.</p>
    <p class="instruction">(Good Luck)</p>
    <div id="message" style="min-height:1.2em; color:#333; margin-bottom:10px;"></div>
    <div id="game">
        <div id="shapes" aria-label="shape palette">
            <div class="shape circle" draggable="true" id="shape-circle"></div>
            <div class="shape triangle" draggable="true" id="shape-triangle"></div>
            <div class="shape pentagon" draggable="true" id="shape-pentagon"></div>
            <div class="shape hexagon" draggable="true" id="shape-hexagon"></div>
            <div class="shape star" draggable="true" id="shape-star"></div>
            <div class="shape diamond" draggable="true" id="shape-diamond"></div>
        </div>
        <div id="holes" aria-label="holes for shapes">
            <div class="hole circle-hole" data-type="circle"></div>
            <div class="hole triangle-hole" data-type="triangle"></div>
            <div class="hole pentagon-hole" data-type="pentagon"></div>
            <div class="hole hexagon-hole" data-type="hexagon"></div>
            <div class="hole star-hole" data-type="star"></div>
            <div class="hole square-hole" data-type="square">⬜</div>
        </div>
    </div>
    <script>
        const shapes = document.querySelectorAll('#shapes .shape');
        const holes = document.querySelectorAll('#holes .hole');

        shapes.forEach(shape => {
            shape.addEventListener('dragstart', ev => {
                ev.dataTransfer.setData('text/plain', shape.id);
                shape.classList.add('dragging');
            });
            shape.addEventListener('dragend', ev => {
                shape.classList.remove('dragging');
            });
        });

        holes.forEach(hole => {
            hole.addEventListener('dragover', ev => {
                ev.preventDefault();
            });
            hole.addEventListener('drop', ev => {
                ev.preventDefault();
                const id = ev.dataTransfer.getData('text/plain');
                const dragged = document.getElementById(id);
                const msg = document.getElementById('message');
                if (hole.dataset.type === 'square') {
                    hole.appendChild(dragged);
                    dragged.draggable = false;
                    dragged.style.cursor = 'default';
                    msg.textContent = '✅ Thats right! It goesin the square hole!';
                } else {
                    hole.classList.add('reject');
                    setTimeout(() => hole.classList.remove('reject'), 300);
                    msg.textContent = '❌ Nope, try again!';
                    setTimeout(() => msg.textContent = '', 1500);
                }
            });
        });
    </script>
    <footer style="margin:20px; text-align:center; font-size:0.9em; color:#000;">
        <p>It belongs in the square Hole</p>
    </footer>
</body>
</html>
